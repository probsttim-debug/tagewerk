<title>Tagwerk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Mobile-first App: schmale Spalte, Sticky-Kopf, Tab-Leiste unten, Karten, Bottom-Sheets */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#E3E9E5; --ink:#15201A; --muted:#5A6A61; --line:#D5DDD8;
  --accent:#24624A; --accent-ink:#FFFFFF; --accent-soft:#D9EADF;
  --gold:#9A6B12; --gold-soft:#F3E7CC; --gold-ink:#3B2A07;
  --danger:#B8402F; --warn:#B7791F; --ok:#1F8455;
  --c-arbeit:#2F66B0; --c-schule:#7350A8; --c-gesundheit:#1F8A68; --c-privat:#C05A30; --c-finanzen:#7D7420; --c-glaube:#9A6B12;
  --overlay:rgba(10,18,14,.45);
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#161D1A; --surface2:#1F2824; --ink:#E5ECE8; --muted:#94A39B; --line:#28322D;
    --accent:#6CC39A; --accent-ink:#0B1610; --accent-soft:#1A3328;
    --gold:#E3BC66; --gold-soft:#2C2412; --gold-ink:#F6E7C4;
    --danger:#EE7C69; --warn:#E8B04F; --ok:#4FC48A;
    --c-arbeit:#7BA7EA; --c-schule:#B49AE6; --c-gesundheit:#5ACCA6; --c-privat:#EC9370; --c-finanzen:#D2C86A; --c-glaube:#E3BC66;
    --overlay:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#161D1A; --surface2:#1F2824; --ink:#E5ECE8; --muted:#94A39B; --line:#28322D;
  --accent:#6CC39A; --accent-ink:#0B1610; --accent-soft:#1A3328;
  --gold:#E3BC66; --gold-soft:#2C2412; --gold-ink:#F6E7C4;
  --danger:#EE7C69; --warn:#E8B04F; --ok:#4FC48A;
  --c-arbeit:#7BA7EA; --c-schule:#B49AE6; --c-gesundheit:#5ACCA6; --c-privat:#EC9370; --c-finanzen:#D2C86A; --c-glaube:#E3BC66;
  --overlay:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
.big,.stat .v,.timer{font-family:var(--body)!important;font-weight:800!important;letter-spacing:-.02em!important}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:14px 10px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:36px;line-height:1;margin:2px 0 0}
h2{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:800;margin:0}
.topbtns{display:flex;gap:6px;align-items:center}
.pillbtn{background:none;font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}

main{display:flex;flex-direction:column;gap:14px;padding-block:6px calc(96px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[data-armed]{background:var(--danger);color:#fff;border-color:transparent}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;font-size:14px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center;flex:none;padding:0}
.icon-btn:hover{background:var(--surface2)}

label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],input:not([type]),select,textarea{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 12px;font-size:16px;color:var(--ink)}
textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addrow .btn{flex:none;padding:0 14px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;min-height:38px;border-radius:10px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.pill{font-size:11px;font-weight:800;border-radius:99px;padding:3px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.hoch{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.pill.mittel{background:color-mix(in srgb,var(--warn) 17%,transparent);color:var(--warn)}
.pill.niedrig{background:var(--surface2);color:var(--muted)}
.pill.late{background:var(--danger);color:#fff}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--cc);display:inline-block}
.cc-Arbeit{--cc:var(--c-arbeit)} .cc-Schule{--cc:var(--c-schule)} .cc-Gesundheit{--cc:var(--c-gesundheit)} .cc-Privat{--cc:var(--c-privat)} .cc-Finanzen{--cc:var(--c-finanzen)} .cc-Glaube{--cc:var(--c-glaube)}

.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;font-size:14px}
.banner b{color:var(--accent)}

/* Vers des Tages */
.verse{background:var(--gold-soft);border:0;color:var(--gold-ink);position:relative;overflow:hidden}
.verse .eyebrow{color:var(--gold)}
.verse blockquote{margin:0;font-family:var(--display);font-style:italic;font-weight:600;font-size:23px;line-height:1.28;text-wrap:pretty}
.verse cite{font-style:normal;font-weight:800;font-size:13px;color:var(--gold);letter-spacing:.03em}
.verse .impulse{font-size:14px;line-height:1.5;border-top:1px solid color-mix(in srgb,var(--gold) 30%,transparent);padding-top:10px}
.verse .btn{background:transparent;border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold-ink)}
.verse .btn.on{background:var(--gold);color:var(--gold-soft);border-color:transparent}

/* Level */
.lvl{display:flex;align-items:center;gap:12px}
.lvl .badge-n{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter b{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.meter.gold b{background:var(--gold)}
.meter.over b{background:var(--danger)}

/* Listen */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.item:first-child{border-top:0}
.item .title{font-weight:700;overflow-wrap:anywhere}
.item .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.tap{background:none;border:0;padding:0;text-align:left;flex:1;min-width:0;display:block}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;color:transparent;padding:0}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.sq{border-radius:8px}
.check svg{width:15px;height:15px}
.group-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:4px 2px -4px}
.group-label.late{color:var(--danger)}
.empty{text-align:center;padding:22px 10px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty strong{color:var(--ink);font-size:16px}

/* Gewohnheiten */
.streak{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.streak button{aspect-ratio:1;border-radius:5px;background:var(--surface2);border:0;padding:0;max-width:100%}
.streak button.on{background:var(--ok)}
.streak button.today{outline:1.5px solid var(--ink);outline-offset:1px}
.fire{font-weight:800;color:var(--warn);font-size:13px;white-space:nowrap}

/* Kalender */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:11px;font-weight:800;color:var(--muted);padding-bottom:2px}
.cal button{border:0;background:var(--bg);border-radius:10px;min-height:46px;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.cal button.out{opacity:.35}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button.sel{background:var(--accent);color:var(--accent-ink)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--cc,var(--accent))}
.cal button.sel .dots i{background:var(--accent-ink)}
.time{font-weight:800;font-variant-numeric:tabular-nums;min-width:46px;color:var(--accent)}

/* Ziele */
.goal{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0;padding-top:0}
.goal .big{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;color:var(--accent);padding:0}
.ms{display:flex;align-items:center;gap:10px;font-size:14px}
.ms.done span{text-decoration:line-through;color:var(--muted)}

/* Stimmung */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods button{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.moods button b{font-family:var(--display);font-size:22px;line-height:1;color:var(--ink)}
.moods button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.moods button[aria-pressed="true"] b{color:var(--accent-ink)}

/* Fokus */
.timer{font-family:var(--display);font-weight:700;font-size:84px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.timer-ring{width:240px;max-width:100%;aspect-ratio:1;margin:0 auto;position:relative}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring .track{stroke:var(--surface2)}
.timer-ring .bar{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.timer-ring.brk .bar{stroke:var(--gold)}
.timer-ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.timer-ring .timer{font-size:62px}

/* Mehr */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:96px}
.tile strong{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.05}
.tile .sub{font-size:13px;color:var(--muted);margin-top:auto}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body);font-weight:700}
.chart .barr{fill:var(--accent)}
.chart .barr.now{fill:var(--gold)}
.chart .ln{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--gold);stroke-width:2}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bdg{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.bdg.on{border-style:solid;border-color:color-mix(in srgb,var(--gold) 55%,transparent);background:var(--gold-soft);opacity:1}
.bdg b{font-size:14px}
.bdg span{font-size:12px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px}

#sheetBg{position:fixed;inset:0;background:var(--overlay);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:90dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
#sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center;flex:none}
.sheet-actions{display:flex;gap:10px;justify-content:space-between}
.sheet-actions .btn.primary{flex:1}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700}
body.signed-out .tabs,body.signed-out #sync{display:none!important}
.auth{display:flex;flex-direction:column;gap:16px;padding-block:18px 40px}
.auth-logo{width:64px;height:64px;border-radius:18px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.auth-logo svg{width:38px;height:38px}
.auth form{display:flex;flex-direction:column;gap:12px}
input[type=email],input[type=password]{width:100%;min-width:0;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:0 12px;font-size:16px;color:var(--ink)}
.err{color:var(--danger);font-size:14px;font-weight:700;min-height:1em}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.timer-ring .timer{font-size:52px}.verse blockquote{font-size:21px}}
</style>

<header class="top"><div class="wrap">
  <div><div class="eyebrow" id="topDate"></div><h1 id="topTitle">Heute</h1></div>
  <div class="topbtns"><button class="pillbtn" id="sync" data-act="account" hidden></button><button class="icon-btn" id="themeBtn" data-act="theme" aria-label="Farbschema wechseln"></button></div>
</div></header>
<main id="view" class="wrap"><div class="loading">Lädt …</div></main>
<nav class="tabs" aria-label="Bereiche"><div class="wrap">
  <button data-act="tab" data-tab="heute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>Heute</button>
  <button data-act="tab" data-tab="planer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M8 14l2.5 2.5L16 12"/></svg>Planer<span class="badge" id="lateBadge" hidden></span></button>
  <button data-act="tab" data-tab="ziele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>Ziele</button>
  <button data-act="tab" data-tab="glaube"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2.5-1 5.5-1 8 .8 2.5-1.8 5.5-1.8 8-.8v13c-2.5-1-5.5-1-8 .8-2.5-1.8-5.5-1.8-8-.8z"/><path d="M12 6.3v13.5"/></svg>Glaube</button>
  <button data-act="tab" data-tab="mehr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>Mehr</button>

function persist(id) {
  if (!backend) return;
  inflight[id] = (inflight[id] || 0) + 1; dirty.add(id);
  chains[id] = (chains[id] || Promise.resolve()).then(() => backend.save(id, docs.get(id)))

    .finally(() => { if (--inflight[id] === 0 && !timers[id]) dirty.delete(id); });

function put(id, data) { clearTimeout(timers[id]); timers[id] = null; docs.set(id, data); persist(id); }
function putLater(id, data, ms = 700) {
  docs.set(id, data); dirty.add(id); clearTimeout(timers[id]);

}
function flushTimers() { for (const id in timers) if (timers[id]) { clearTimeout(timers[id]); timers[id] = null; persist(id); } }
addEventListener('pagehide', flushTimers);

async function init() {
  if (FB) { initFirebase(); return; }
  let db = null, user = null, uid = null;
  try {
    if (!IS_PWA) {
      for (let i = 0; i < 20 && !(window.claude && claude.use); i++) await new Promise(r => setTimeout(r, 100));
      if (window.claude && claude.use) {
        [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
        if (user) uid = await user.id();
      }
    }
  } catch (e) { console.warn(e); }
  if (db && uid) connectDb(db.collection('data/users/' + uid)); else connectLocal();
}
function connectDb(coll, fireAndForget) {
  mode = 'db';
  backend = fireAndForget
    // Firestore puffert Schreibvorgänge selbst (auch offline) – nicht auf die Server-Bestätigung warten
    ? { save: async (k, d) => { coll.doc(k).set(d).catch(writeError); } }
    : { save: (k, d) => coll.doc(k).set(d) };
  let seeded = false;
  coll.onSnapshot(snap => {
    for (const d of snap.docs) if (DEF[d.id] && !dirty.has(d.id)) docs.set(d.id, d.data());
    if (!snap.metadata.fromCache && !seeded) { seeded = true; if (!D('meta').seeded) seed(); }
    if (!ready && (!snap.metadata.fromCache || docs.has('meta'))) ready = true;
    setSync('Konto');
    requestRender();
  }, err => { console.warn(err); setSync('Offline'); });
  setTimeout(() => { if (!ready) { ready = true; if (!D('meta').seeded) seed(); render(); } }, 6000);
}
function writeError(e) { console.error(e); toast('Speichern fehlgeschlagen. Bitte melde dich neu an.'); }
function connectLocal() {
  mode = 'local';

  const save = async () => { try { localStorage.setItem(LS, JSON.stringify(Object.fromEntries(docs))); } catch {} };
  backend = { save };

  ready = true; setSync(IS_PWA ? 'Backup' : 'Nur dieses Gerät');

}

  while (h.days[k]) { n++; k = shiftKey(k, -1); }

  return best;
}

/* ---------- Fokus-Timer ---------- */
const T = { mode: 'work', work: 25, brk: 5, left: 25 * 60, running: false, end: 0, iv: null, taskId: '' };
const timerText = () => pad(Math.floor(T.left / 60)) + ':' + pad(T.left % 60);
let actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .25, .5].forEach(o => { const os = actx.createOscillator(), g = actx.createGain(); os.frequency.value = 660; g.gain.setValueAtTime(.15, actx.currentTime + o); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + o + .2); os.connect(g).connect(actx.destination); os.start(actx.currentTime + o); os.stop(actx.currentTime + o + .22); });
  } catch {}
}
function tick() {
  T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  const el = $('#timerVal'); if (el) el.textContent = timerText();
  const bar = $('#timerBar'); if (bar) { const tot = (T.mode === 'work' ? T.work : T.brk) * 60, C = 2 * Math.PI * 100; bar.style.strokeDashoffset = C * (1 - T.left / tot); }
  if (T.left <= 0) finishPhase();
}
function finishPhase() {
  clearInterval(T.iv); T.running = false; beep();
  if (T.mode === 'work') {
    edit('focus', f => { f.sessions.push({ date: todayKey(), minutes: T.work, taskId: T.taskId || '' }); }, true);
    points(15); toast('Fokus-Einheit geschafft! +15 Punkte. Zeit für eine Pause.');
    T.mode = 'brk'; T.left = T.brk * 60;
  } else { T.mode = 'work'; T.left = T.work * 60; toast('Pause vorbei. Weiter geht\'s!'); }
  render();
}
function vFokus() {
  const t = todayKey(), ss = D('focus').sessions.filter(s => s.date === t), mins = ss.reduce((a, s) => a + num(s.minutes), 0);
  const tot = (T.mode === 'work' ? T.work : T.brk) * 60, C = 2 * Math.PI * 100;
  const tasks = openTasks().sort(byTask).slice(0, 30);
  return `<div class="card"><div class="timer-ring ${T.mode === 'work' ? '' : 'brk'}"><svg viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="100" fill="none" stroke-width="12"/><circle id="timerBar" class="bar" cx="110" cy="110" r="100" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - T.left / tot)}"/></svg>
      <div class="lbl"><div class="eyebrow">${T.mode === 'work' ? 'Arbeitsphase' : 'Pause'}</div><div class="timer" id="timerVal">${timerText()}</div></div></div>
    <div class="row" style="justify-content:center;flex-wrap:wrap;gap:6px"><button class="btn ${T.running ? '' : 'primary'}" data-act="timerToggle" style="min-width:140px">${T.running ? 'Pausieren' : 'Starten'}</button><button class="btn ghost" data-act="timerReset">Zurücksetzen</button>${T.running ? '' : `<button class="btn ghost" data-act="timerSkip">${T.mode === 'work' ? 'Zur Pause' : 'Pause überspringen'}</button>`}</div>
    <label class="field">Woran arbeitest du?<select id="f-task" data-chg="focusTask"><option value="">Keine bestimmte Aufgabe</option>${tasks.map(x => `<option value="${x.id}" ${T.taskId === x.id ? 'selected' : ''}>${esc(x.title)}</option>`).join('')}</select></label>
    <div class="grid2"><label class="field">Arbeit (Min.)<input type="number" id="f-work" min="5" max="120" value="${T.work}" data-chg="focusLen" data-k="work" ${T.running ? 'disabled' : ''}></label><label class="field">Pause (Min.)<input type="number" id="f-brk" min="1" max="60" value="${T.brk}" data-chg="focusLen" data-k="brk" ${T.running ? 'disabled' : ''}></label></div></div>

function vRueckblick() {
  const t = todayKey(), mon = shiftKey(t, -((pkey(t).getDay() + 6) % 7)), week = [...Array(7)].map((_, i) => shiftKey(mon, i));
  const tasks = D('tasks').items, hs = D('habits').items, fs = D('focus').sessions, je = D('journal').entries;
  const doneIn = ks => tasks.filter(x => x.done && ks.includes(x.doneDate)).length;
  const habIn = ks => hs.reduce((a, hb) => a + ks.filter(k => hb.days[k]).length, 0);
  const focIn = ks => fs.filter(s => ks.includes(s.date)).reduce((a, s) => a + num(s.minutes), 0);
  const moods = week.map(k => je[k] && je[k].mood).filter(Boolean), avg = moods.length ? moods.reduce((a, b) => a + num(b), 0) / moods.length : 0;
  const last14 = [...Array(14)].map((_, i) => shiftKey(t, i - 13));
  const L = level(), B = badges();
  const wd = doneIn(week), wh = habIn(week), wf = focIn(week);
  const summary = wd + wh + wf === 0 ? 'Diese Woche ist noch frisch. Jeder kleine Schritt zählt.'
    : `Diese Woche hast du ${wd} ${wd === 1 ? 'Aufgabe' : 'Aufgaben'} erledigt, ${wh}-mal eine Gewohnheit gepflegt und ${wf} Minuten fokussiert gearbeitet.${avg ? ` Deine Stimmung lag im Schnitt bei ${fmt(avg, 1)} von 5.` : ''} Gut gemacht!`;
  return `<div class="card"><div class="eyebrow">Diese Woche</div><p style="margin:0;font-size:16px;line-height:1.5;font-weight:600">${esc(summary)}</p>
      <div class="stat3"><div class="stat"><div class="v">${wd}</div><div class="l">Aufgaben</div></div><div class="stat"><div class="v">${wh}</div><div class="l">Gewohnh.</div></div><div class="stat"><div class="v">${wf}</div><div class="l">Fokus-Min.</div></div></div></div>
    <div class="card"><h3>Erledigte Aufgaben, letzte 14 Tage</h3>${barChart(last14.map(k => ({ k, v: doneIn([k]) })))}</div>
    <div class="card"><h3>Stimmung, letzte 14 Tage</h3>${moodChart(last14.map(k => ({ k, v: je[k] && je[k].mood ? num(je[k].mood) : null })))}</div>
    <div class="card"><div class="lvl"><div class="badge-n">${L.lvl}</div><div class="grow"><h3>Level ${L.lvl} · ${L.p} Punkte</h3><div class="meter gold" style="margin-top:6px"><b style="width:${L.rest}%"></b></div><div class="small muted" style="margin-top:6px">Aufgabe +10 · Gewohnheit +5 · Fokus-Einheit +15 · Tagebuch +5</div></div></div>
      <div class="badges">${B.map(([n, d, on]) => `<div class="bdg ${on ? 'on' : ''}"><b>${esc(n)}</b><span>${esc(d)}</span></div>`).join('')}</div></div>`;
}
function barChart(data) {

  if (authState === 'out') { $('#topDate').textContent = ''; $('#topTitle').textContent = 'Tagwerk'; view.innerHTML = vAuth(); return; }
  const now = new Date();
  $('#topDate').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#topTitle').textContent = ui.tab === 'mehr' && ui.more ? MORE[ui.more] : TITLES[ui.tab];
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.toggleAttribute('aria-current', false) || (b.dataset.tab === ui.tab && b.setAttribute('aria-current', 'page')));
  const lc = lateCount(), lb = $('#lateBadge'); lb.hidden = !lc; lb.textContent = lc;
  view.innerHTML = ({ heute: vHeute, planer: vPlaner, ziele: vZiele, glaube: vGlaube, mehr: vMehr })[ui.tab]();
}
let lastDay = todayKey();
setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); ui.verseShift = 0; requestRender(); } }, 60000);
init();
})();
</script>
